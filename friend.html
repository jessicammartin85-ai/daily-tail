<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#a76a43">
<title>Daily Tales | Friend View</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#34495b;background:#d9e6ef}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:repeating-linear-gradient(90deg,#dce9f1 0 48px,#f5f2e9 48px 96px);padding:20px 12px 40px}
header{max-width:620px;margin:0 auto 16px;text-align:center}header strong{font:700 33px Georgia,serif;color:#68432d;text-shadow:0 2px #fff5ec}header p{margin:5px;color:#526b7b}
main{max-width:620px;margin:0 auto;background:#fff9ee;border:3px solid #a9c5d6;border-radius:25px;padding:clamp(18px,5vw,34px);box-shadow:0 9px 26px #39495133}
#status{font-size:15px;line-height:1.6;text-align:center}h1{font:700 clamp(31px,8vw,46px) Georgia,serif;color:#774b32;text-align:center;margin:10px 0}
.portrait{margin:15px auto;display:block;width:min(58vw,230px);height:min(58vw,230px);object-fit:cover;border-radius:50%;border:9px solid #bed7e5;box-shadow:0 4px 16px #66503a44}
.tag{display:inline-block;background:#e9eff3;border:1px solid #aec4d4;border-radius:999px;padding:7px 13px;margin:7px 5px 5px 0;font-size:14px}
.section{margin-top:20px;padding:14px 0 0;border-top:1px solid #d5cbbb}.section h2{font:700 22px Georgia,serif;color:#77553b;margin:0 0 9px}
.section p{line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.memory{padding:11px 13px;background:#e7f0f5;border-radius:13px;margin:10px 0}.memory strong{display:block;color:#4c5966}
footer{max-width:620px;text-align:center;margin:22px auto;color:#586a7c;font-size:12px}
a{color:#385f78}#content[hidden]{display:none}
body{background:#f6f0e7;padding-bottom:105px}main{max-width:760px;background:transparent;border:0;padding:0;box-shadow:none}#content>h1,#content>.portrait,#tags,#details{display:none}#memories{margin:24px 14px;padding:18px;background:#fff9ee;border:2px solid #a9c5d6;border-radius:18px}#memories:empty{display:none}#dtFriendDesignHome{margin-top:16px!important}#dtFriendDesignPhoto:not([src]){visibility:hidden}
.friend-connections{margin:16px 14px;background:#d5e1e9;border:2px solid #9bb5c4;border-radius:25px;padding:20px}.friend-connections h2{font:700 34px Georgia;margin:0 0 18px}.friend-empty{border:1px dashed #99b4c5;background:#fff9ee;border-radius:20px;padding:20px}.friend-empty strong{font:700 23px Georgia}.friend-empty p{line-height:1.5}.friend-request{display:block;margin-top:16px;padding:18px;text-align:center;background:#365e75;color:white;border-radius:17px;text-decoration:none;font-weight:bold}.friend-nav{position:fixed;z-index:10;bottom:10px;left:50%;transform:translateX(-50%);width:min(calc(100% - 24px),736px);display:flex;border:2px solid #aac2d1;border-radius:24px;background:#fff9ee;padding:8px;box-shadow:0 4px 15px #263d5033}.friend-nav button{flex:1;border:0;border-radius:17px;padding:12px;background:transparent;color:#365e75;font-weight:700;cursor:pointer}.friend-nav button:first-child{background:#365e75;color:white}#memories{scroll-margin-top:20px}
</style></head><body class="friend-view">

<main><p id="status">Loading your friend's dog profile…</p><section id="content" hidden><div id="dtConceptHome" hidden></div><div id="publicAdapter" hidden><img id="profileThumb"><span id="recentPostTitle"></span><span id="recentPostSummary"></span><img id="recentPostThumb" hidden><span id="dtFactsDogName"></span><span id="dtFactsBreed"></span><span id="dtFactsBirthday"></span><span id="dtFactsQuote"></span><button id="recent" type="button"></button></div><h1 id="dogName"></h1><img id="dogPhoto" class="portrait" alt="Dog portrait" hidden><div style="text-align:center" id="tags"></div><div id="details"></div><div id="memories"></div><section id="friendConnections" class="friend-connections"><h2>Dog Friends 🐾</h2><div class="friend-empty"><strong>Dog friends</strong><p>Connected dog profiles are not included in this shared view.</p></div><button type="button" class="friend-request" id="publicFriendRequest" style="width:100%;border:0;cursor:pointer">🐾 Send Friend Request</button></section></section></main>
<nav class="friend-nav" aria-label="Friend View navigation"><button id="friendHomeNav" type="button">⌂<br>Home</button><button id="friendFriendsNav" type="button">🐾<br>Friends</button></nav><footer>Friend View is read-only. You don't need to sign in to see a profile shared with you.</footer>
<script src="./friend-design.js?v=public-friend-20261106" defer></script>
<dialog id="friendAccount" style="width:min(90vw,430px);border:2px solid #9bb5c4;border-radius:22px;background:#fff9ee;color:#34495b;padding:24px"><button id="closeFriendAccount" type="button" style="float:right" aria-label="Close">×</button><h2>Send a friend request</h2><p id="friendAccountIntro">Sign in or create an account to continue.</p><div id="friendAccountFields"><button id="friendGoogle" type="button">Continue with Google</button><p>or use your email</p><form id="friendEmailForm"><label>Email<input name="email" type="email" autocomplete="email" required style="display:block;width:100%;padding:12px;margin:8px 0"></label><label>Password<input name="password" type="password" autocomplete="current-password" minlength="6" required style="display:block;width:100%;padding:12px;margin:8px 0"></label><button type="submit" value="login">Sign in</button> <button type="submit" value="register">Create account</button></form></div><button id="sendPublicRequest" type="button" hidden>Send friend request</button><p id="friendRequestStatus" role="status"></p></dialog>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import {getAuth,onAuthStateChanged,GoogleAuthProvider,signInWithPopup,signInWithEmailAndPassword,createUserWithEmailAndPassword} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import {getFirestore,doc,onSnapshot,collection,getDocs,query,where,limit,setDoc,serverTimestamp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
const firebase=initializeApp({apiKey:'AIzaSyCdtV1qU_JxApJv3YwJqadUurjdAsCph98',authDomain:'daily-tail.firebaseapp.com',projectId:'daily-tail',messagingSenderId:'789609946634',appId:'1:789609946634:web:5c116c9bb8bd5051ad89f3'},'daily-tail-public-friend');
const db=getFirestore(firebase),id=new URLSearchParams(location.search).get('share'),el=x=>document.getElementById(x);
el('friendHomeNav').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});el('friendFriendsNav').onclick=()=>el('friendConnections').scrollIntoView({behavior:'smooth',block:'start'});

const friendAuth=getAuth(firebase);
let friendUser=null,publicDog=null;
const requestStatus=t=>el('friendRequestStatus').textContent=t;
function renderFriendAccount(){
 el('friendAccountFields').hidden=!!friendUser;
 el('sendPublicRequest').hidden=!friendUser;
 el('friendAccountIntro').textContent=friendUser?'Signed in as '+(friendUser.email||friendUser.displayName||'Daily Tales member')+'. Send a request to connect with '+(publicDog?.name||'this dog')+'?':'Sign in or create an account to send a friend request.';
}
onAuthStateChanged(friendAuth,u=>{friendUser=u;renderFriendAccount()});
el('publicFriendRequest').onclick=()=>{requestStatus('');renderFriendAccount();el('friendAccount').showModal()};
el('closeFriendAccount').onclick=()=>el('friendAccount').close();
el('friendGoogle').onclick=async()=>{try{await signInWithPopup(friendAuth,new GoogleAuthProvider())}catch(e){requestStatus('Could not sign in: '+(e.code||e.message))}};
el('friendEmailForm').onsubmit=async e=>{
 e.preventDefault();const f=e.currentTarget;requestStatus('Signing in…');
 try{
  const action=e.submitter?.value==='register'?createUserWithEmailAndPassword:signInWithEmailAndPassword;
  await action(friendAuth,f.elements.email.value.trim(),f.elements.password.value);
  requestStatus('');
 }catch(e){requestStatus('Could not sign in: '+(e.code||e.message))}
};
el('sendPublicRequest').onclick=async()=>{
 if(!friendUser)return renderFriendAccount();
 const button=el('sendPublicRequest');button.disabled=true;
 try{
  if(!publicDog)throw Error('The profile is not available. Please refresh.');
  if(friendUser.uid===publicDog.ownerUid)throw Error('This is your own dog profile.');
  const listings=await getDocs(query(collection(db,'directory'),where('discoverable','==',true),where('shareId','==',id),limit(1)));
  if(listings.empty)throw Error('The owner needs to enable Find Friends for this dog before receiving friend requests.');
  const listing=listings.docs[0],data=listing.data();
  const previous=await getDocs(query(collection(db,'friendRequests'),where('requesterUid','==',friendUser.uid),limit(100)));
  if(previous.docs.some(r=>r.data().listingId===listing.id&&['pending','approved'].includes(r.data().status))){
    requestStatus('You already have a pending request or an approved connection with this dog.');return;
  }
  await setDoc(doc(collection(db,'friendRequests')),{requesterUid:friendUser.uid,requesterName:friendUser.displayName||'Daily Tales member',targetOwnerUid:data.ownerUid,dogId:data.dogId,listingId:listing.id,status:'pending',createdAt:serverTimestamp(),updatedAt:serverTimestamp()});
  requestStatus('Friend request sent! The owner can review it in Find Friends.');
  el('publicFriendRequest').textContent='Friend request pending';
 }catch(e){requestStatus(e.message||'Unable to send the request. Please try again.')}
 finally{button.disabled=false}
};

function section(title,text){if(!text)return;const root=document.createElement('section');root.className='section';const h=document.createElement('h2');h.textContent=title;const p=document.createElement('p');p.textContent=String(text);root.append(h,p);el('details').append(root)}
async function start(){
 if(!id||!/^[a-zA-Z0-9]{16,40}$/.test(id)){el('status').textContent='This sharing link is incomplete. Ask the owner for a new Friend View link.';return}
 try{
  onSnapshot(doc(db,'publicProfiles',id),result=>{
  if(!result.exists()||result.data().active!==true){el('content').hidden=true;el('status').hidden=false;el('status').textContent='This link is no longer available. Ask the owner for an updated Friend View link.';return}
  const d=result.data();publicDog=d;
  el('content').hidden=false;
  el('dtFactsDogName').textContent=d.name||'My Dog';
  el('dtFactsBreed').textContent=d.breed||'Not added yet';
  let birthday=d.dob||'Not added yet';
  if(d.dob){const born=new Date(d.dob+'T12:00:00');if(!isNaN(born)){const now=new Date();let months=(now.getFullYear()-born.getFullYear())*12+now.getMonth()-born.getMonth();if(now.getDate()<born.getDate())months--;months=Math.max(0,months);birthday=born.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})+' · '+(months<12?months+' months':Math.floor(months/12)+' years');}}
  el('dtFactsBirthday').textContent=birthday;
  el('dtFactsQuote').textContent=d.cuteFact||d.personality||'';
  if(typeof d.photo==='string'&&d.photo.startsWith('data:image/'))el('profileThumb').src=d.photo;else el('profileThumb').removeAttribute('src');
  const latest=Array.isArray(d.posts)?d.posts[0]:null;
  el('recentPostTitle').textContent=latest?.title||'No shared posts yet';
  el('recentPostSummary').textContent=latest?.text||'Shared memories will appear here';
  el('recent').onclick=()=>el('memories').scrollIntoView({behavior:'smooth',block:'start'});el('tags').replaceChildren();el('details').replaceChildren();el('memories').replaceChildren();el('dogPhoto').hidden=true;el('dogName').textContent=d.name||'A Daily Tales friend';
  if(d.photo&&typeof d.photo==='string'&&d.photo.startsWith('data:image/')){el('dogPhoto').src=d.photo;el('dogPhoto').hidden=false}
  for(const value of [d.breed,d.dob])if(value){const tag=document.createElement('span');tag.className='tag';tag.textContent=value;el('tags').append(tag)}
  section('About me',d.personality);section('Favorite things',d.favorites);section('Fun fact',d.cuteFact);
  if(Array.isArray(d.posts)&&d.posts.length){
   const outer=document.createElement('section');outer.className='section';const title=document.createElement('h2');title.textContent='Memories';outer.append(title);
   for(const p of d.posts){const card=document.createElement('div');card.className='memory';const strong=document.createElement('strong');strong.textContent=p.title||'A little memory';const description=document.createElement('p');description.textContent=p.text||'';card.append(strong,description);outer.append(card)}el('memories').append(outer)
  }
  el('status').hidden=true;el('content').hidden=false;
  },e=>{el('status').textContent='This profile could not be updated right now.';el('status').hidden=false;console.error(e)});
 }catch(e){el('status').textContent=e?.code==='permission-denied'?'This link is waiting for the owner to enable public Friend View sharing in Firebase.':'Unable to load this profile right now. Please try again later.';console.error('Daily Tail Friend View',e)}
}
start();
</script></body></html>
